<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks | Prophet Card</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-color: #FFECD7;
            font-family: Helvetica, Arial, sans-serif;
        }
        .prophet-card {
            width: 560px;
            max-width: 100%;
            padding: 34px 48px 64px;
            border: 6px solid #004E63;
            border-radius: 42px;
            background-color: #008DB1;
            color: #FFFFFE;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 58px;
            font-weight: normal;
        }
        .subtitle {
            display: block;
            margin-bottom: 28px;
            color: #91E4FB;
            font-size: 26px;
            line-height: 1.3;
            text-decoration: none;
        }
        .subtitle:hover, .subtitle:focus-visible { text-decoration: underline; }
        .portrait {
            display: block;
            width: 390px;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border: 6px solid #FFFFFE;
        }
        ul {
            width: fit-content;
            margin: 16px auto 28px;
            padding-left: 30px;
            text-align: left;
            font-size: 29px;
            line-height: 1.35;
        }
        blockquote {
            margin: 0;
            color: #FFD783;
            font-family: "Brush Script MT", "Nanum Brush Script", cursive;
            font-size: 32px;
            line-height: 1.45;
        }
        @media (max-width: 600px) {
            body { padding: 16px; }
            .prophet-card { padding: 28px 22px 40px; }
            h1 { font-size: clamp(30px, 8vw, 58px); }
            .subtitle { font-size: 20px; }
            ul { font-size: 21px; }
            blockquote { font-size: 27px; }
        }
    </style>
</head>
<body>
    <main class="prophet-card">
        <h1>Dallin H. Oaks</h1>
        <a class="subtitle" href="https://www.churchofjesuschrist.org/">18th President of the Church of Jesus Christ of Latter-day Saints</a>
        <img class="portrait" src="images/dallin_oaks.jpg" alt="Portrait of Dallin H. Oaks">
        <ul>
            <li>Born: Aug 12, 1932</li>
            <li>Apostle: Apr 7, 1984</li>
            <li>Prophet: Oct 14, 2025</li>
        </ul>
        <blockquote>“The gospel of Jesus Christ teaches us that our highest priority is to love God and to love our fellowmen.”</blockquote>
    </main>
</body>
</html>
